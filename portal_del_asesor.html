<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal del Asesor - specialhome.com.mx</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #F9F7F4;
            --bg-panel: #FFFFFF;
            --text-main: #1A1A1A;
            --text-muted: #666666;
            --color-primary: #C5A059;
            --color-success: #27AE60;
            --border-color: #E2E8F0;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --alert-bg: #F0FDF4;
            --alert-text: #166534;
            --alert-border: #BBF7D0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Lato", sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* BARRA LATERAL ACTUALIZADA */
        .sidebar {
            width: 110px;
            background-color: #1A1A1A;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 0;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 10;
        }

        .sidebar-brand {
            width: 65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            text-decoration: none;
        }

        .brand-logo-img { width: 38px; height: auto; object-fit: contain; display: block; }
        
        .brand-text {
            font-weight: 700;
            font-size: 7.5px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #FFFFFF;
            margin-top: 4px;
            text-align: center;
            white-space: nowrap;
        }

        /* ÍCONOS FLAT MINIMALISTAS CON TEXTO DEBAJO */
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-bottom: 16px;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-icon-box {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #AAA;
            border-radius: 10px;
            background-color: transparent;
            transition: all 0.2s ease;
        }

        .nav-item.active .nav-icon-box, .nav-item:hover .nav-icon-box {
            background-color: #2D2D2D;
            color: var(--color-primary);
        }

        .nav-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #888888;
            text-align: center;
            transition: color 0.2s ease;
        }

        .nav-item.active .nav-label, .nav-item:hover .nav-label {
            color: var(--color-primary);
        }

        .main-content {
            margin-left: 110px;
            flex: 1;
            padding: 35px 40px;
            max-width: 1200px;
            width: calc(100% - 110px);
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #FFFFFF;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
            box-shadow: var(--shadow-sm);
        }

        .alert-banner {
            background-color: var(--alert-bg);
            border: 1px solid var(--alert-border);
            border-radius: 12px;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            color: var(--alert-text);
        }

        .lead-alert-box {
            background: #FFFBEB;
            border: 1px solid #FDE68A;
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 25px;
            color: #92400E;
        }

        .alert-left { display: flex; align-items: center; gap: 12px; font-weight: 700; }
        .alert-icon { font-size: 1.2rem; }

        .btn-add-property {
            background-color: var(--color-primary);
            color: #1A1A1A;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 900;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }
        .btn-add-property:hover { opacity: 0.9; }

        .admin-section {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-sm);
        }

        .filter-bar {
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }

        .filter-left { display: flex; align-items: center; gap: 15px; font-weight: 700; font-size: 0.95rem; }
        .checkbox-custom { width: 18px; height: 18px; cursor: pointer; border-radius: 4px; border: 1px solid #CBD5E1; }
        
        .search-wrapper { position: relative; width: 320px; }
        .search-input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }
        .search-input:focus { border-color: var(--color-primary); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94A3B8; }

        .property-card {
            background-color: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .card-main-row {
            display: flex;
            padding: 24px;
            align-items: center;
            gap: 24px;
            border-bottom: 1px solid #F1F5F9;
        }

        .property-img-wrapper {
            width: 140px;
            height: 110px;
            border-radius: 10px;
            overflow: hidden;
            background-color: #E2E8F0;
            flex-shrink: 0;
        }
        .property-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .property-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .info-tag { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .info-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); text-decoration: none; cursor: pointer; }
        .info-title:hover { color: var(--color-primary); }
        .info-address { font-size: 0.85rem; color: var(--text-muted); }
        .info-price { font-size: 1.1rem; font-weight: 900; color: var(--text-main); margin-top: 4px; }
        .info-creator { font-size: 0.78rem; font-weight: 700; color: #4A5568; margin-top: 4px; }

        .status-badge-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 0 20px;
            border-right: 1px solid #F1F5F9;
        }
        .tag-status { font-size: 0.85rem; font-weight: 700; color: var(--color-success); display: flex; align-items: center; gap: 6px; }

        .health-chart-container {
            position: relative;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .health-chart { width: 100%; height: 100%; transform: rotate(-90deg); }
        .health-chart circle { fill: none; stroke-width: 5; }
        .health-chart .bg { stroke: #F1F5F9; }
        .health-chart .progress { stroke: var(--color-success); stroke-dasharray: 176; stroke-linecap: round; }
        .chart-text { position: absolute; font-size: 0.85rem; font-weight: 700; color: var(--text-main); }

        .performance-col { flex: 1.2; display: flex; padding-left: 20px; align-items: center; justify-content: space-between; }
        .perf-item { display: flex; flex-direction: column; gap: 6px; }
        .perf-label { font-size: 0.8rem; font-weight: 700; color: #94A3B8; }
        .perf-value { font-size: 0.95rem; font-weight: 700; color: var(--text-muted); }
        .perf-link { font-size: 0.85rem; color: var(--text-main); font-weight: 700; cursor: pointer; text-decoration: underline; }

        .btn-boost {
            padding: 10px 18px;
            background-color: #F8FAFC;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #94A3B8;
        }

        .card-meta-row {
            background-color: #F8FAFC;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .meta-left { display: flex; gap: 24px; }
        .meta-item span { font-weight: 700; color: var(--text-main); }
        
        .meta-actions { display: flex; gap: 16px; align-items: center; }
        .action-icon-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; color: #64748B; padding: 4px; }
        .action-icon-btn:hover { color: var(--color-primary); }
        .action-icon-btn.delete:hover { color: #E53E3E; }

        .empty-state { text-align: center; padding: 60px 20px; background: #FFF; border-radius: 16px; border: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <nav class="sidebar">
        <a href="/" class="sidebar-brand">
            <img src="/static/logo sh_Mesa de trabajo 1.png" alt="Special Home" class="brand-logo-img">
            <div class="brand-text">Special Home</div>
        </a>
        
        <a href="/portal" class="nav-item active">
            <div class="nav-icon-box">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </div>
            <span class="nav-label">Portal</span>
        </a>

        <a href="/kanban" class="nav-item">
            <div class="nav-icon-box">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            </div>
            <span class="nav-label">Kanban</span>
        </a>

        <a href="/alta-propiedad" class="nav-item">
            <div class="nav-icon-box">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </div>
            <span class="nav-label">Propiedad</span>
        </a>
    </nav>

    <main class="main-content">
        
        <div class="session-header">
            <div>
                <h2 id="sessionAsesorName">Cargando sesión...</h2>
                <span id="sessionRolBadge" style="font-size: 0.75rem; font-weight: 900; text-transform: uppercase; color: var(--color-primary);">Rol: --</span>
            </div>
            <button onclick="cerrarSesion()" style="background: #E53E3E; color: #FFF; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer;">Cerrar Sesión</button>
        </div>

        <div id="nuevosLeadsAlertContainer"></div>

        <div class="alert-banner">
            <div class="alert-left">
                <span class="alert-icon">🛒</span>
                <span>Mis propiedades disponibles: <strong id="totalCount">0</strong></span>
            </div>
            <a href="/alta-propiedad" class="btn-add-property">+ Dar de Alta Propiedad</a>
        </div>

        <div id="adminAsesoresSection" class="admin-section" style="display: none;">
            <h3 style="margin-bottom: 15px; font-weight: 900;">👥 Gestión de Colaboradores y Asesores (Admin)</h3>
            <form id="formNuevoAsesor" onsubmit="registrarAsesor(event)" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <input type="text" id="nuevoNombre" placeholder="Nombre completo *" required style="padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;">
                <input type="email" id="nuevoEmail" placeholder="Correo electrónico (Login) *" required style="padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;">
                <input type="password" id="nuevoPassword" placeholder="Contraseña temporal *" required style="padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;">
                <input type="tel" id="nuevoWhatsapp" placeholder="WhatsApp (Ej. 5512345678) *" required style="padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;">
                <select id="nuevoRol" style="padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: #FFF;">
                    <option value="Asesor">Perfil: Asesor</option>
                    <option value="Admin">Perfil: Admin</option>
                </select>
                <button type="submit" style="background: var(--text-main); color: #FFF; border: none; padding: 10px; border-radius: 6px; font-weight: 900; cursor: pointer;">Registrar Asesor</button>
            </form>
        </div>

        <div class="filter-bar">
            <div class="filter-left">
                <input type="checkbox" class="checkbox-custom">
                <span>Se encontraron <span id="foundCount">0</span> inmuebles</span>
            </div>
            
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar por título o colonia..." oninput="filtrarPropiedades()">
            </div>
        </div>

        <div id="propiedadesContainer">
            <div class="empty-state">⏳ Cargando propiedades de Special Home...</div>
        </div>

    </main>

    <script>
        let propiedadesGlobal = [];
        let asesorActual = null;

        function verificarSesion() {
            const sesionStr = localStorage.getItem("special_home_asesor");
            if (!sesionStr) {
                window.location.href = "/login";
                return;
            }
            asesorActual = JSON.parse(sesionStr);
            document.getElementById("sessionAsesorName").innerText = `Bienvenido, ${asesorActual.nombre}`;
            document.getElementById("sessionRolBadge").innerText = `Rol: ${asesorActual.rol}`;

            if (asesorActual.rol === "Admin") {
                document.getElementById("adminAsesoresSection").style.display = "block";
            }
        }

        function cerrarSesion() {
            localStorage.removeItem("special_home_asesor");
            window.location.href = "/login";
        }

        async function cargarDatosPortal() {
            verificarSesion();
            await cargarPropiedades();
            await cargarAlertasProspectos();
        }

        async function cargarAlertasProspectos() {
            try {
                const res = await fetch("/api/prospectos");
                const data = await res.json();
                const prospectos = data.prospectos || [];
                
                let noLeidos = [];
                if (asesorActual.rol === "Admin") {
                    noLeidos = prospectos.filter(p => p.leido === 0);
                } else {
                    const slugsPermitidos = propiedadesGlobal.map(p => p.slug);
                    noLeidos = prospectos.filter(p => p.leido === 0 && slugsPermitidos.includes(p.propiedad_interes));
                }

                const container = document.getElementById("nuevosLeadsAlertContainer");

                if (noLeidos.length > 0) {
                    container.innerHTML = `
                        <div class="lead-alert-box">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                <strong>🔔 ¡Tienes ${noLeidos.length} nuevo(s) prospecto(s) solicitando información!</strong>
                                <a href="/kanban" style="color: #92400E; font-weight: 900; text-decoration: underline;">Ver en Kanban →</a>
                            </div>
                            <ul style="list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem;">
                                ${noLeidos.map(l => `
                                    <li style="display: flex; justify-content: space-between; align-items: center; background: #FFF; padding: 8px 12px; border-radius: 6px; border: 1px solid #FDE68A;">
                                        <span>👤 <strong>${l.nombre}</strong> (${l.telefono}) interesado en Ref: <strong>${l.propiedad_interes}</strong></span>
                                        <button onclick="marcarLeido(${l.id})" style="background: #D97706; color: #FFF; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; font-weight: 700;">Marcar Leído</button>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    `;
                } else {
                    container.innerHTML = "";
                }
            } catch (e) { console.error(e); }
        }

        async function marcarLeido(id) {
            await fetch(`/api/prospectos/${id}/marcar-leido`, { method: "PUT" });
            cargarAlertasProspectos();
        }

        async function registrarAsesor(e) {
            e.preventDefault();
            const nombre = document.getElementById("nuevoNombre").value;
            const email = document.getElementById("nuevoEmail").value;
            const password = document.getElementById("nuevoPassword").value;
            const whatsapp = document.getElementById("nuevoWhatsapp").value;
            const rol = document.getElementById("nuevoRol").value;

            try {
                const resp = await fetch("/api/asesores", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nombre, email, password, whatsapp, rol })
                });

                if (resp.ok) {
                    alert("✅ Asesor registrado con éxito.");
                    e.target.reset();
                } else {
                    const err = await resp.json();
                    alert("❌ Error: " + (err.detail || "No se pudo registrar"));
                }
            } catch (ex) { alert("❌ Error de red al registrar asesor."); }
        }

        async function cargarPropiedades() {
            try {
                let url = "/api/propiedades";
                if (asesorActual.rol !== "Admin") {
                    url += `?creador=${encodeURIComponent(asesorActual.email)}`;
                }

                const res = await fetch(url);
                const data = await res.json();
                propiedadesGlobal = data.propiedades || [];
                
                document.getElementById("totalCount").innerText = propiedadesGlobal.length;
                document.getElementById("foundCount").innerText = propiedadesGlobal.length;

                renderizarTarjetas(propiedadesGlobal);
            } catch (err) {
                console.error(err);
                document.getElementById("propiedadesContainer").innerHTML = `<div class="empty-state" style="color: #E74C3C;">❌ Error al conectar con el servidor.</div>`;
            }
        }

        function calcularScoreSEO(p) {
            const texto = (p.descripcion || "").toLowerCase();
            let puntos = 0;
            if (texto.length >= 300) puntos += 25;
            if (["casa", "departamento", "propiedad", "nave industrial", "terreno", "local"].some(w => texto.includes(w))) puntos += 25;
            if (p.colonia && texto.includes(p.colonia.toLowerCase())) puntos += 25;
            if (p.precio_lista > 0) puntos += 25;
            return puntos;
        }

        function renderizarTarjetas(lista) {
            const container = document.getElementById("propiedadesContainer");
            if (lista.length === 0) {
                container.innerHTML = `<div class="empty-state"><h2>🏡 No se encontraron propiedades asignadas a tu cuenta</h2></div>`;
                return;
            }

            container.innerHTML = lista.map(p => {
                const foto = p.imagen_principal || "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=300&auto=format&fit=crop";
                const precioFormateado = "$ " + Number(p.precio_lista).toLocaleString('en-US');
                const score = calcularScoreSEO(p);
                const strokeDashoffset = 176 - (176 * score / 100);
                const codigoRef = "SH-" + p.id.toString().padStart(4, '0');

                const botonEliminarAdmin = asesorActual.rol === "Admin" ? 
                    `<button class="action-icon-btn delete" title="Eliminar Propiedad" onclick="eliminarPropiedad(${p.id}, '${p.titulo}')">🗑️</button>` : 
                    '';

                return `
                    <div class="property-card">
                        <div class="card-main-row">
                            <div class="property-img-wrapper">
                                <img src="${foto}" alt="${p.titulo}">
                            </div>
                            
                            <div class="property-info">
                                <span class="info-tag">${p.tipo_propiedad}</span>
                                <a class="info-title" href="/editar-propiedad/${p.id}">${p.titulo}</a>
                                <span class="info-address">${p.calle_numero}, ${p.colonia}, ${p.municipio}</span>
                                <span class="info-price">${p.tipo_operacion} ${precioFormateado}</span>
                                <span class="info-creator">👤 Creado por: <strong>${p.asesor_creador}</strong></span>
                            </div>

                            <div class="status-badge-col">
                                <span class="tag-status">SEO</span>
                                <div class="health-chart-container">
                                    <svg class="health-chart">
                                        <circle class="bg" cx="32.5" cy="32.5" r="28"></circle>
                                        <circle class="progress" cx="32.5" cy="32.5" r="28" style="stroke-dashoffset: ${strokeDashoffset};"></circle>
                                    </svg>
                                    <div class="chart-text">${score}%</div>
                                </div>
                            </div>

                            <div class="performance-col">
                                <div class="perf-item">
                                    <span class="perf-label">📈 Desempeño</span>
                                    <div style="display: flex; gap: 30px; margin-top: 4px;">
                                        <div><div class="perf-label">Terreno</div><div class="perf-value">${p.terreno_m2} m²</div></div>
                                        <div><div class="perf-label">Construcción</div><div class="perf-value">${p.construccion_m2} m²</div></div>
                                    </div>
                                </div>
                                <div class="perf-item" style="align-items: flex-end;">
                                    <span class="perf-label">Consultas</span>
                                    <a class="perf-link" href="/kanban?propiedad=${p.slug}">Ver Kanban</a>
                                </div>
                                <button class="btn-boost">Optimizada</button>
                            </div>
                        </div>

                        <div class="card-meta-row">
                            <div class="meta-left">
                                <div class="meta-item">Ref <span>${codigoRef}</span></div>
                                <div class="meta-item">Estatus <span>${p.estatus || 'Publicado'}</span></div>
                            </div>
                            <div class="meta-actions">
                                <button class="action-icon-btn" title="Editar Ficha" onclick="window.location.href='/editar-propiedad/${p.id}'">📝</button>
                                <button class="action-icon-btn" title="Ver Kanban" onclick="window.location.href='/kanban?propiedad=${p.slug}'">📊</button>
                                ${botonEliminarAdmin}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function eliminarPropiedad(id, titulo) {
            if (!confirm(`⚠️ ¿Estás totalmente seguro de eliminar la propiedad "${titulo}"? Esta acción no se puede deshacer.`)) return;

            try {
                const resp = await fetch(`/api/propiedades/${id}?admin_email=${encodeURIComponent(asesorActual.email)}`, {
                    method: "DELETE"
                });

                if (resp.ok) {
                    alert("🗑️ Propiedad eliminada correctamente.");
                    cargarPropiedades();
                } else {
                    const err = await resp.json();
                    alert("❌ Error: " + (err.detail || "No se pudo eliminar la propiedad"));
                }
            } catch (ex) {
                alert("❌ Error de red al intentar eliminar la propiedad.");
            }
        }

        function filtrarPropiedades() {
            const q = document.getElementById("searchInput").value.toLowerCase();
            const filtradas = propiedadesGlobal.filter(p => 
                p.titulo.toLowerCase().includes(q) || p.colonia.toLowerCase().includes(q)
            );
            document.getElementById("foundCount").innerText = filtradas.length;
            renderizarTarjetas(filtradas);
        }

        cargarDatosPortal();
    </script>
</body>
</html>
