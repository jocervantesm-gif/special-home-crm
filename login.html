<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Corporativo | Portal del Asesor - Special Home</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #1A1A1A;
            --color-primary: #C5A059;
            --color-primary-dark: #A38448;
            --border-color: #2D2D2D;
            --text-main: #1A1A1A;
            --text-muted: #666666;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Lato", sans-serif; }

        body {
            background-color: #F9F7F4;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logo-svg { width: 50px; height: auto; margin-bottom: 10px; }
        .brand-logo-svg path { fill: #1A1A1A; }
        
        .brand-title {
            font-weight: 900;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #1A1A1A;
            margin-bottom: 25px;
            text-align: center;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 900;
            margin-bottom: 6px;
            color: var(--text-main);
            text-align: center;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            text-align: center;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.75rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--color-primary);
        }

        .btn-submit {
            background: linear-gradient(135deg, #C5A059 0%, #A38448 100%);
            color: #FFFFFF;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 10px;
            transition: filter 0.2s;
        }

        .btn-submit:hover {
            filter: brightness(1.1);
        }

        .error-message {
            background-color: #FEE2E2;
            color: #B91C1C;
            border: 1px solid #FCA5A5;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            width: 100%;
            display: none;
            text-align: center;
            font-weight: 700;
        }

        .back-home {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 700;
        }
        .back-home:hover { color: var(--color-primary); }
    </style>
</head>
<body>

    <div class="login-card">
        <a href="/" style="display: flex; flex-direction: column; align-items: center; text-decoration: none;">
            <svg class="brand-logo-svg" viewBox="0 0 785 785" version="1.0" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
                <g transform="translate(0.000000,785.000000) scale(0.100000,-0.100000)" stroke="none">
                    <path d="M1157 7777 c77 -64 2068 -1695 2278 -1865 44 -36 118 -97 164 -135 45 -39 109 -90 140 -116 31 -25 89 -72 129 -105 l72 -58 44 33 c51 40 362 292 521 424 61 50 344 282 630 515 929 758 1569 1281 1628 1331 l59 49 -153 0 -153 0 -106 -39 c-58 -22 -211 -79 -340 -126 -129 -48 -356 -132 -505 -187 -739 -274 -1479 -548 -1562 -578 l-63 -23 -82 31 c-405 151 -1659 619 -1718 642 -41 16 -227 85 -413 154 l-338 126 -160 0 -161 0 89 -73z"/>
                </g>
            </svg>
            <div class="brand-title">Special Home</div>
        </a>

        <h1>Portal del Asesor</h1>
        <p class="subtitle">Inicia sesión con tus credenciales corporativas</p>

        <div id="errorAlert" class="error-message"></div>

        <form class="login-form" onsubmit="ejecutarLogin(event)">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="loginEmail" placeholder="ejemplo@specialhome.com.mx" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Ingresar al Portal</button>
        </form>

        <a href="/" class="back-home">← Volver al sitio público</a>
    </div>

    <script>
        async function ejecutarLogin(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;
            const errorAlert = document.getElementById("errorAlert");

            errorAlert.style.display = "none";

            try {
                const resp = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await resp.json();

                if (resp.ok) {
                    // Guardar los datos del asesor en localStorage para control de roles y sesión
                    localStorage.setItem("special_home_asesor", JSON.stringify(data.asesor));
                    window.location.href = "/portal";
                } else {
                    errorAlert.innerText = data.detail || "Credenciales incorrectas.";
                    errorAlert.style.display = "block";
                }
            } catch (err) {
                console.error(err);
                errorAlert.innerText = "Error de conexión con el servidor.";
                errorAlert.style.display = "block";
            }
        }
    </script>
</body>
</html>
